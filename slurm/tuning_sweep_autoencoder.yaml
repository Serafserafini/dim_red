# GPU/SLURM variant of configs/tuning_sweep_autoencoder.example.yaml -- run
# via slurm/tune_all_models.sbatch, array task 1. See
# src/dim_red/pipeline/CLAUDE.md's "pipeline.benchmark" section for how to
# read the resulting sweep with dimred-benchmark.
#
# Sized for a real run on RealMemory=2000000 (~2TB) A100 nodes:
# structures_per_family: 1000 (7000 raw structures total -- host RAM is a
# complete non-issue at this scale for a SOAP-based model_kind). aux_heads.mode
# is now itself a grid axis (family_only vs family_and_spacegroup)
# specifically to compare with/without the spacegroup head -- family_only
# runs simply won't have a spacegroup_probs/spacegroup_2d_* column in
# dimred-benchmark's table, family_and_spacegroup runs will, so the
# comparison is a straight present-vs-blank read of the table.
# early_stopping is on, so the raised epochs budget doesn't cost extra time
# on runs that converge early.
#
# With the full 2-day/GPU budget confirmed safe (dry-run on cgcnn: real
# max_atoms after supercell_radius: 4.0 was 256, not the ~1000+ that caused
# the earlier crash -- see slurm/tuning_sweep_cgcnn.yaml), widened to
# 4 grid axes / 24 runs: vae.latent_dim added (2, 4 -> 8) and
# train.learning_rate added (2), on top of encoder_hidden_dim (3) and
# aux_heads.mode (2). All 24 runs still share one cached dataset build.

base:
  seed: 42
  output_dir: runs/tuning_autoencoder
  model: autoencoder
  data_source: pyxtal

  pyxtal:
    families: [cubic, hexagonal, orthorhombic, tetragonal, trigonal, monoclinic, triclinic]
    structures_per_family: 1000
    distribution: uniform
    n_species: 2
    seed: 42

  soap:
    r_cut: 5.0
    n_max: 4
    l_max: 3
    sigma: 0.5
    element_agnostic: false
    normalize_distances: false
    species: null

  vae:
    encoder_hidden_dim: [128] # overridden by the grid below
    latent_dim: 8 # overridden by the grid below
    mirror: true

  aux_heads:
    mode: family_and_spacegroup # overridden by the grid below
    lambda_family: 1.0
    lambda_spacegroup: 1.0
    head_hidden_dim: 16

  train:
    epochs: 100
    batch_size: 64
    learning_rate: 0.001 # overridden by the grid below
    optimizer: adam
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 15
      min_delta: 0.0001
      restore_best_weights: true

  # Applied to every fetched/generated structure before SOAP, regardless of
  # data_source. n_augmented: 4 + keep_original: true -> 5x the raw pyxtal
  # count (7000 -> 35000 structures fed to SOAP/training). Kept identical
  # across all four slurm/tuning_sweep_*.yaml configs so augmentation
  # itself isn't a confound between model kinds.
  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

# 3 hidden-dim x 2 latent_dim x 2 aux_heads modes x 2 learning rates = 24
# runs, all sharing one cached dataset build.
grid:
  vae.encoder_hidden_dim:
    - [64]
    - [128, 64]
    - [128, 64, 32]
  vae.latent_dim: [4, 8]
  aux_heads.mode: [family_only, family_and_spacegroup]
  train.learning_rate: [0.0005, 0.002]
