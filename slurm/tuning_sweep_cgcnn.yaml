# GPU/SLURM variant of configs/tuning_sweep_cgcnn.example.yaml -- run via
# slurm/tune_all_models.sbatch, array task 3. See
# src/dim_red/pipeline/CLAUDE.md's "pipeline.benchmark" section for how to
# read the resulting sweep with dimred-benchmark.
#
# Sized for a real run on RealMemory=2000000 (~2TB) A100 nodes:
# structures_per_family: 1000, all 7 crystal families, x5 after augmentation
# (n_augmented: 4 + keep_original: true) -> 35000 structures actually fed to
# graph construction. cgcnn is the one model_kind where dataset size
# interacts with RAM at all (whole-dataset dense graph padding to the single
# largest structure's atom count -- see src/dim_red/cgcnn/CLAUDE.md), and
# augmentation.supercell_radius is exactly the setting that caused a real
# 70GB crash earlier on this project, on this same 7-family/~35000-structure
# scale (one triclinic structure's supercell ballooned to ~1000 atoms, and
# every structure gets padded to that single largest one). Verified locally
# before committing this to the 2-day array job -- specifically re-verified
# with ALL 7 families included (not just the 4 symmetric ones checked
# earlier), since triclinic/monoclinic were the suspected culprits last
# time: generated+augmented a representative sample with these exact
# families/n_species/supercell_radius settings (150 structures/family, 1050
# raw -> 5250 augmented) and measured the actual resulting atom counts per
# family -- real max was 256 atoms (cubic, spacegroup 230; triclinic and
# monoclinic topped out at 240 and were NOT the worst family here, unlike
# in the original crash). The difference from the earlier crash is
# supercell_radius itself (4.0 here vs. the much larger radius that
# produced ~1000-atom outliers) -- family choice alone wasn't the deciding
# factor. Projected RAM at the full 35000-structure scale with that
# observed max_atoms: ~20GB -- trivial against this node's ~2TB. (max_atoms
# itself still isn't logged before the allocation happens, see
# dim_red.cgcnn.graph.atoms_list_to_graph_arrays -- rerun the same local
# check if you ever raise supercell_radius further.)
#
# With the budget confirmed safe, widened to 5 grid axes / 32 runs:
# graph.h_fea_len (2, 64 -> 128) and vae.latent_dim (2, 4 -> 8) added on top
# of graph.n_conv (2), graph.atom_fea_len (2) and aux_heads.mode (2,
# with/without the spacegroup head -- family_only runs simply won't have a
# spacegroup_probs/spacegroup_2d_* column in dimred-benchmark's table,
# family_and_spacegroup runs will). All 32 runs still share one cached
# graph dataset build (only pyxtal/graph-construction settings affect the
# cache key, none of which vary here -- h_fea_len/n_conv/atom_fea_len are
# architecture-only). early_stopping is on, so the raised epochs budget
# doesn't cost extra time on runs that converge early.

base:
  seed: 42
  output_dir: runs/tuning_cgcnn
  model: cgcnn
  data_source: pyxtal

  pyxtal:
    families: [cubic, hexagonal, orthorhombic, tetragonal, trigonal, monoclinic, triclinic]
    structures_per_family: 100
    distribution: uniform
    n_species: 2
    seed: 42

  # Only vae.latent_dim is read for model: cgcnn -- see
  # configs/single_run_cgcnn.example.yaml's comments.
  vae:
    encoder_hidden_dim: [1]
    latent_dim: 8 # overridden by the grid below

  graph:
    radius: 6.0
    max_num_nbr: 12
    dmin: 0.0
    dmax: null
    step: 0.2
    max_species: 2
    atom_fea_len: 64 # overridden by the grid below
    n_conv: 3 # overridden by the grid below
    h_fea_len: 128 # overridden by the grid below
    n_h: 1

  aux_heads:
    mode: family_and_spacegroup # overridden by the grid below
    lambda_family: 1.0
    lambda_spacegroup: 1.0
    head_hidden_dim: 16

  train:
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 15
      min_delta: 0.0001
      restore_best_weights: true

  # Applied to every generated structure before graph construction. Kept
  # identical (down to supercell_radius) across all four
  # slurm/tuning_sweep_*.yaml configs so augmentation itself isn't a
  # confound between model kinds -- see the file-level comment above for
  # why supercell_radius: 4.0 is safe here specifically.
  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

# 2 conv depths x 2 atom_fea_len widths x 2 h_fea_len widths x 2 aux_heads
# modes x 2 latent_dim = 32 runs, all sharing one cached graph dataset
# build.
grid:
  graph.n_conv: [3, 4]
  graph.atom_fea_len: [8, 16]
  graph.h_fea_len: [16, 32]
  aux_heads.mode: [family_only, family_and_spacegroup]
  vae.latent_dim: [4, 8]
