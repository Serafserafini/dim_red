# GPU/SLURM variant of configs/tuning_sweep_supcon.example.yaml -- run via
# slurm/tune_all_models.sbatch, array task 2. See
# src/dim_red/pipeline/CLAUDE.md's "pipeline.benchmark" section for how to
# read the resulting sweep with dimred-benchmark.
#
# Sized for a real run on RealMemory=2000000 (~2TB) A100 nodes:
# structures_per_family: 1000 (7000 raw structures total -- host RAM is a
# complete non-issue at this scale for a SOAP-based model_kind). supcon.mode
# is now itself a grid axis (family_only vs family_and_spacegroup) --
# whether the body's own contrastive objective is trained against spacegroup
# labels at all, specifically to compare with/without spacegroup supervision.
# tails.classification.mode stays fixed at family_and_spacegroup regardless
# (so every run, including the family_only-trained ones, still gets a
# `spacegroup` accuracy readout in dimred-benchmark's table -- lets you see
# whether spacegroup separates "for free" even without explicit supervision).
# early_stopping is on (body AND tail), so the raised epochs budgets don't
# cost extra time on runs that converge early.
#
# With the full 2-day/GPU budget confirmed safe (dry-run on cgcnn: real
# max_atoms after supercell_radius: 4.0 was 256, not the ~1000+ that caused
# the earlier crash -- see slurm/tuning_sweep_cgcnn.yaml), supcon.distance
# is back in the grid (2, euclidean/cosine) on top of encoder_hidden_dim (2),
# supcon.mode (2), supcon.tau (2) and batching.strategy (2) = 32 runs.
# vae.latent_dim deliberately left fixed (not a grid axis here, unlike the
# other three kinds' configs): supcon already pays extra cost per run over
# vae/autoencoder/cgcnn (an auto-trained classification tail runs right
# after every body), so it's the one kind kept a notch more conservative
# rather than pushing to 64 runs.

base:
  seed: 42
  output_dir: runs/tuning_supcon
  model: supcon
  data_source: pyxtal

  pyxtal:
    families: [cubic, hexagonal, orthorhombic, tetragonal, trigonal, monoclinic, triclinic]
    structures_per_family: 1000
    distribution: uniform
    n_species: 2
    seed: 42

  soap:
    r_cut: 5.0
    n_max: 4
    l_max: 3
    sigma: 0.5
    element_agnostic: false
    normalize_distances: false
    species: null

  vae:
    encoder_hidden_dim: [128] # overridden by the grid below
    latent_dim: 8
    mirror: true

  supcon:
    mode: family_and_spacegroup # overridden by the grid below
    lambda_family: 1.0
    lambda_spacegroup: 1.0
    tau: 0.1 # overridden by the grid below
    distance: euclidean # overridden by the grid below
    lambda_norm: 0.0

  # K/S only take effect for the runs where the grid below picks
  # batching.strategy: balanced; harmlessly ignored for the "random" runs.
  batching:
    strategy: random # overridden by the grid below
    balanced_params: {P: null, K: 16, S: 4}

  tails:
    classification:
      mode: family_and_spacegroup
    train:
      epochs: 40
      batch_size: 32
      optimizer: adam
      device: gpu
      early_stopping:
        enabled: true
        patience: 10
        min_delta: 0.0001
        restore_best_weights: true

  train:
    epochs: 100
    batch_size: 64
    learning_rate: 0.001
    optimizer: adam
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 15
      min_delta: 0.0001
      restore_best_weights: true

  # Applied to every fetched/generated structure before SOAP, regardless of
  # data_source. n_augmented: 4 + keep_original: true -> 5x the raw pyxtal
  # count (7000 -> 35000 structures fed to SOAP/training). Kept identical
  # across all four slurm/tuning_sweep_*.yaml configs so augmentation
  # itself isn't a confound between model kinds.
  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

# 2 hidden-dim x 2 supcon modes x 2 tau values x 2 batching strategies x 2
# distances = 32 runs, all sharing one cached dataset build.
grid:
  vae.encoder_hidden_dim:
    - [64]
    - [128, 64]
  supcon.mode: [family_only, family_and_spacegroup]
  supcon.tau: [0.05, 0.1]
  batching.strategy: [random, balanced]
  supcon.distance: [euclidean, cosine]
