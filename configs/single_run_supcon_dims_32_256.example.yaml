# Dimension-exploration follow-up to the round 15 Khosla-topology experiment
# (configs/single_run_supcon_dims_32_16.example.yaml): the 32/16 combination
# gave a minimal/negative gain (family accuracy dropped 0.973->0.955, SG
# oracle 0.903->0.891 vs round 14's 32/128), so this explores the space
# around the two empirically-best points found so far (32/128 for
# spacegroup, 8/128 for family): latent_dim=32 (was 8/32), projection_dim
# =256 (was 128/16). One axis changed at a time from those reference
# points. projection_hidden_dim stays null -> resolves to [32].
#
# tails.classification (auto-trained, light recipe) identical to round 7's.
#
# Run with:
#   dimred-run configs/single_run_supcon_dims_32_256.example.yaml --cache-dir runs/_shared_dataset_cache_family_only_geom_rich

seed: 42
output_dir: runs/experiment_pipeline_dims_32_256
model: supcon
data_source: pyxtal

soap:
  r_cut: 6.0
  n_max: 8
  l_max: 6
  sigma: 0.5
  element_agnostic: true
  normalize_distances: false
  species: null

vae:
  encoder_hidden_dim: [128, 64]
  latent_dim: 32
  mirror: true

train:
  epochs: 200
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  val_ratio: 0.2
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true

supcon:
  mode: family_only
  lambda_family: 1.0
  tau: 0.05
  distance: cosine
  lambda_norm: 0.0
  projection_dim: 256
  projection_hidden_dim: null

batching:
  strategy: random
  balanced_params:
    K: 16

pyxtal:
  families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
  structures_per_family: 500
  distribution: uniform
  n_species: 1
  seed: 42

augmentation:
  n_augmented: 4
  keep_original: true
  jitter_probability: 0.5
  jitter_std: 0.05
  vacancy_probability: 0.5
  vacancy_atom_probability: 1
  max_vacancies: 1
  supercell_radius: 4.0
  seed: 42

tails:
  train:
    epochs: 40
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    device: gpu
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
      restore_best_weights: true
  classification:
    mode: family_only
    lambda_family: 1.0
    head_hidden_dim: 16
