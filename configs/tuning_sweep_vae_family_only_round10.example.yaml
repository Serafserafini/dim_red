# Round 10 ("scale_invariance_retuned") of
# configs/tuning_sweep_vae_family_only_round9.example.yaml: round 9
# enabled soap.normalize_distances but kept r_cut/sigma at round 7's
# absolute values (6.0/0.5 A) -- diagnosed (experiments/round9_notes.md)
# as broken: normalize_distances rescales every structure so its
# nearest-neighbor distance becomes 1.0, so a FIXED absolute r_cut/sigma
# applied afterwards corresponds to a wildly different EFFECTIVE physical
# cutoff per structure (measured: original nearest-neighbor distances
# range 0.58-4.2 A across this dataset, median 2.13 A -- so round 9's
# r_cut=6.0 in the rescaled frame corresponded to an effective original
# cutoff anywhere from ~3.5 A to ~25 A depending on the structure).
# Result: family accuracy collapsed to 0.51-0.74 (vs round 7's 0.85-0.95).
#
# This round re-expresses r_cut/sigma in the NEW relative unit system
# (nearest-neighbor distance = 1.0) instead of reusing round 7's absolute
# numbers: r_cut = 3.0 (~round 7's 6.0/2.13-median ratio, rounded --
# captures roughly 2-3 coordination shells consistently across every
# structure, instead of a wildly varying absolute radius), sigma = 0.25
# (same ratio logic, 0.5/2.13 rounded). This is technically two numbers
# changed alongside normalize_distances relative to round 7 -- but
# conceptually still ONE variable (is the descriptor scale-invariant),
# since r_cut/sigma MUST be re-expressed in the new unit system for the
# comparison to mean anything; reusing round 7's absolute numbers (round
# 9) was the actual uncontrolled second variable, not this retuning.
#
# Everything else identical to round 7/9 (n_species=1, element_agnostic=
# true, structures_per_family=500, batch=128/epochs=200). NEW dataset
# cache (soap_kwargs changed), own warmup.
#
# Run with: dimred-sweep configs/tuning_sweep_vae_family_only_round10.example.yaml --cache-dir runs/_shared_dataset_cache_family_only_round10

base:
  seed: 42
  output_dir: runs/tuning_vae_family_only_round10
  model: vae
  data_source: pyxtal

  pyxtal:
    families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
    structures_per_family: 500
    distribution: uniform
    n_species: 1
    seed: 42

  soap:
    r_cut: 3.0 # was 6.0 (absolute A) -- retuned for the normalize_distances=true relative unit system (nearest-neighbor distance = 1.0)
    n_max: 8
    l_max: 6
    sigma: 0.25 # was 0.5 (absolute A) -- same retuning
    element_agnostic: true
    normalize_distances: true
    species: null

  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

  vae:
    encoder_hidden_dim: [128, 64] # fixed, same as round 7/9
    latent_dim: 8
    mirror: true

  aux_heads:
    mode: family_only
    lambda_family: 2.0 # fixed, same as round 7/9
    head_hidden_dim: 16

  train:
    epochs: 200
    batch_size: 128
    learning_rate: 0.001
    optimizer: adam
    beta: 1.0 # overridden by the grid below
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 20
      min_delta: 0.0001
      restore_best_weights: true

# 2 beta values -- same 2 runs as round 7/9, only r_cut/sigma changed.
grid:
  train.beta: [0.5, 2.0]
