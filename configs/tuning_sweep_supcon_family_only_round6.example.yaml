# Round 6 ("dataset_scale") of configs/tuning_sweep_supcon_family_only_geom_rich.example.yaml
# (round 3) -- see configs/tuning_sweep_vae_family_only_round6.example.yaml's
# header comment for the full rationale: doubles pyxtal.structures_per_family
# from round 3's 500 to 1000 (35000 total structures after augmentation,
# matching the recovered old sweep's scale), holding soap.r_cut/n_max/l_max
# at round 3's confirmed level (6.0/8/6, dim=252), everything else identical
# to round 3 -- including keeping both supcon.distance values in the grid
# (round 3/5 both re-confirmed euclidean stays well behind cosine; this
# round re-checks that conclusion still holds at this dataset scale rather
# than assuming it and dropping euclidean).
#
# tails.classification is still fixed on (not swept) so every run gets a
# `family` accuracy in dimred-benchmark's table via its
# tails/classification/tail_predictions.npz.
#
# Shares the exact same pyxtal:/soap:/augmentation: fragment as
# configs/tuning_sweep_{vae,autoencoder}_family_only_round6.example.yaml,
# so it hashes to the identical (new) dataset cache key -- run against
# runs/_shared_dataset_cache_family_only_round6 (see
# slurm/warmup_shared_dataset_family_only_round6.sbatch).
#
# Run with: dimred-sweep configs/tuning_sweep_supcon_family_only_round6.example.yaml --cache-dir runs/_shared_dataset_cache_family_only_round6

base:
  seed: 42
  output_dir: runs/tuning_supcon_family_only_round6
  model: supcon
  data_source: pyxtal

  pyxtal:
    families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
    structures_per_family: 1000 # was 500 in round 3
    distribution: uniform
    n_species: 1
    seed: 42

  soap:
    r_cut: 6.0
    n_max: 8
    l_max: 6
    sigma: 0.5
    element_agnostic: true
    normalize_distances: false
    species: null

  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

  vae:
    encoder_hidden_dim: [128] # overridden by the grid below
    latent_dim: 8
    mirror: true

  supcon:
    mode: family_only
    lambda_family: 1.0
    tau: 0.1 # overridden by the grid below
    distance: euclidean # overridden by the grid below
    lambda_norm: 0.0
    projection_dim: 128

  batching:
    strategy: random # overridden by the grid below
    balanced_params: {P: null, K: 16, S: null}

  tails:
    classification:
      mode: family_only
      head_hidden_dim: 16
    train:
      epochs: 40
      batch_size: 32
      optimizer: adam
      device: gpu
      early_stopping:
        enabled: true
        patience: 10
        min_delta: 0.0001
        restore_best_weights: true

  train:
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
      restore_best_weights: true

# 2 encoder shapes x 2 tau values x 2 distances x 2 batching strategies =
# 16 runs -- same grid as round 3, only the dataset scale changed.
grid:
  vae.encoder_hidden_dim:
    - [64]
    - [128, 64]
  supcon.tau: [0.05, 0.1]
  supcon.distance: [euclidean, cosine]
  batching.strategy: [random, balanced]
