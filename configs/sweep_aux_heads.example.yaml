# Example sweep config demonstrating the auxiliary classification heads:
# grid over VAE hidden-layer configs (axis A) x crystal-system subsets
# (axis B) x lambda_family/lambda_spacegroup (axis C, only expanded because
# aux_heads.mode == family_and_spacegroup below).
# Run with: python -m dim_red.pipeline.cli --config configs/sweep_aux_heads.example.yaml --sweep

seed: 42
output_dir: runs
api_key: null

data:
  crystal_system_sets:
    - [cubic, hexagonal]
    - [cubic, hexagonal, tetragonal]
  limit_per_system: 15

soap:
  r_cut: 5.0
  n_max: 4
  l_max: 3
  sigma: 0.5
  element_agnostic: false
  normalize_distances: false
  species: null

vae:
  hidden_layer_configs:
    - [128]
    - [128, 64]
  latent_dim: 2
  mirror: true

# family_and_spacegroup adds both heads on z, with the spacegroup head
# conditioned on family via masking. Requires >= 2 crystal systems in each
# crystal_system_sets entry so there is more than one family class to learn.
aux_heads:
  mode: family_and_spacegroup
  lambda_family_values: [0.5, 1.0]
  lambda_spacegroup_values: [0.5, 1.0]
  head_hidden_dim: 16

train:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  beta: 1.0
  val_ratio: 0.2
  device: cpu
