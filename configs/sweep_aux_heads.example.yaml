# Example sweep config demonstrating the auxiliary classification heads,
# using the generic "base" + "grid" sweep schema (see sweep.example.yaml for
# the general explanation): a grid over VAE hidden-layer configs x
# crystal-system subsets x lambda_family/lambda_spacegroup.
# Run with: python -m dim_red.pipeline.cli --config configs/sweep_aux_heads.example.yaml --sweep
# or:       dimred-sweep configs/sweep_aux_heads.example.yaml

base:
  seed: 42
  output_dir: runs
  api_key: null

  data:
    crystal_systems: [cubic, hexagonal]
    limit_per_system: 15

  soap:
    r_cut: 5.0
    n_max: 4
    l_max: 3
    sigma: 0.5
    element_agnostic: false
    normalize_distances: false
    species: null

  vae:
    encoder_hidden_dim: [128]
    latent_dim: 2
    mirror: true

  # family_and_spacegroup adds both heads on z, with the spacegroup head
  # conditioned on family via masking. Requires >= 2 crystal systems in every
  # data.crystal_systems value below so there is more than one family class
  # to learn.
  aux_heads:
    mode: family_and_spacegroup
    head_hidden_dim: 16

  train:
    epochs: 20
    batch_size: 32
    learning_rate: 0.001
    beta: 1.0
    val_ratio: 0.2
    device: cpu

# 2 crystal-system sets x 2 hidden-layer configs x 2 lambda_family x 2
# lambda_spacegroup = 16 runs.
grid:
  data.crystal_systems:
    - [cubic, hexagonal]
    - [cubic, hexagonal, tetragonal]
  vae.encoder_hidden_dim:
    - [128]
    - [128, 64]
  aux_heads.lambda_family: [0.5, 1.0]
  aux_heads.lambda_spacegroup: [0.5, 1.0]
