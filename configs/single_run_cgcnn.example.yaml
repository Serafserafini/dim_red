# Example config for a single pyxtal -> graph -> CGCNN run: a
# graph-convolutional encoder-only body (Xie & Grossman 2018, reimplemented
# natively in JAX/Flax -- no torch/torch_geometric/dgl/jraph dependency),
# trained JOINTLY with classifier head(s) via cross-entropy on family
# (+ optional spacegroup) labels -- single-phase, mirroring
# the aux_heads pattern, NOT supcon's two-phase
# contrastive-pretrain-then-freeze-and-train-a-tail design. Unlike SOAP,
# CGCNN builds its own graph representation directly from a crystal's atoms
# and bonds -- no soap: block at all for this model. See CLAUDE.md /
# dim_red.cgcnn.
# Run with: dimred-run configs/single_run_cgcnn.example.yaml
# or:       dimred-run configs/single_run_cgcnn.example.yaml

seed: 42
output_dir: runs
model: cgcnn # only "cgcnn" here; supcon/supcon_mace use the FullStack schema (configs/full_stack*.example.yaml)
data_source: pyxtal # pyxtal recommended: guarantees a known family/spacegroup
# label for every generated structure, exactly what aux_heads needs. "fetch"
# (Materials Project) works too, but MP structures are missing spacegroup
# data for some entries (see fetch.py's -1 "unknown" sentinel).

# "fetch" (crystal_systems/limit_per_system/api_key) is unused with
# data_source: pyxtal -- omitted here.

pyxtal:
  families: [cubic, hexagonal, orthorhombic]
  structures_per_family: 40
  distribution: uniform
  n_species: 2
  seed: 42

# "soap" block is unused for model: cgcnn -- CGCNN reads "graph" below
# instead. Omitted here.

# Shared encoder: block every model_kind reads its latent_dim from --
# encoder_hidden_dim is IGNORED for model: cgcnn (only latent_dim is read:
# the body's output width, saved to embeddings.npz, reused by every
# downstream tail). encoder_hidden_dim still needs *some* value below purely
# because it's a required field with no default.
encoder:
  encoder_hidden_dim: [1] # ignored for model: cgcnn (dummy placeholder value)
  latent_dim: 32 # READ: CGCNN body's output width

# CGCNN graph-construction + architecture hyperparameters.
graph:
  radius: 8.0 # cutoff radius (Angstroms) for periodic-boundary-aware
    # neighbor search (dim_red.cgcnn.graph, via ase.neighborlist -- correct
    # even when radius exceeds half the unit cell's width, unlike a naive
    # minimum-image-convention distance matrix). CGCNN's own default.
  max_num_nbr: 12 # closest neighbors kept per atom; padded/masked if fewer found
  dmin: 0.0
  dmax: null # null (default) -> resolves to radius
  step: 0.2 # Gaussian filter spacing -> n_gaussian = (dmax-dmin)/step + 1
    # (41 with the defaults above)
  # Maximum distinct species any one structure may have. The model NEVER
  # sees which real chemical element a species is -- only a per-structure
  # local species slot (1..max_species), so it can distinguish "species A"
  # from "species B" within a structure without learning any real
  # chemistry. This fits pyxtal's own species pool perfectly (sampled from
  # an arbitrary placeholder pool -- see dim_red.generate -- with no
  # chemical meaning to begin with). Set this >= pyxtal.n_species above (or
  # >= the largest species count any fetched structure has, for
  # data_source: fetch).
  max_species: 10
  atom_fea_len: 64 # per-atom embedding/hidden width (nn.Embed keyed by the
    # local species slot above, learnable -- a deliberate, simpler
    # substitute for the original repo's fixed 92-dim atom_init.json
    # lookup table, which was itself keyed by real atomic number)
  n_conv: 3 # number of stacked gated graph-convolution layers
  h_fea_len: 128 # post-pooling hidden width
  n_h: 1 # number of post-pooling hidden layers

# aux_heads is CGCNN's ONLY training objective (no reconstruction, no
# contrastive loss exists for this model) -- mode must NOT be "none",
# enforced at config-parse time (RunConfig.__post_init__ raises otherwise).
aux_heads:
  mode: family_and_spacegroup # "family_only" or "family_and_spacegroup"
  lambda_family: 1.0
  lambda_spacegroup: 1.0
  head_hidden_dim: 16

train:
  epochs: 30
  batch_size: 16
  learning_rate: 0.001 # Adam's learning rate
  val_ratio: 0.2
  device: cpu
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.0
    restore_best_weights: true

# Classification / visualization tails on this run's frozen body are trained
# afterwards with dimred-train-tail <tail config> <run_dir> (see
# configs/tail_train_*.example.yaml); the top-level tails: block that used to
# auto-train them here was removed and is now rejected.
