# Round 2 of configs/tuning_sweep_supcon_family_only.example.yaml (see
# experiments/family_only_sweep_notes.md, not tracked by git): identical in
# every other respect, but soap.element_agnostic: true and pyxtal.n_species: 1
# -- see configs/tuning_sweep_vae_family_only_geom_only.example.yaml's header
# comment for the full rationale (comparison against the recovered
# experiments/old_runs/runs/20260812-1 sweep).
#
# supcon.distance: euclidean dropped entirely (fixed at cosine instead) --
# a dedicated 2x2 factorial isolation test
# (configs/tuning_sweep_supcon_euclidean_factors.example.yaml) already
# showed that soap.element_agnostic: true roughly doubles euclidean's
# accuracy (0.18 -> ~0.35) but comes nowhere close to cosine's 0.98+ even
# with this same geometric-signal fix applied -- re-sweeping all 8
# euclidean combinations here would very likely just confirm that same gap
# again at more expense. If genuinely narrowing that gap further (e.g. with
# the old sweep's richer soap.r_cut/n_max/l_max or deeper encoder too)
# becomes worth testing, add supcon.distance: [euclidean, cosine] back.
#
# tails.classification is still fixed on (not swept) so every run gets a
# `family` accuracy in dimred-benchmark's table via its
# tails/classification/tail_predictions.npz.
#
# Shares the exact same pyxtal:/soap:/augmentation: fragment as
# configs/tuning_sweep_{vae,autoencoder}_family_only_geom_only.example.yaml,
# so it hashes to the identical (new) dataset cache key -- run against
# runs/_shared_dataset_cache_family_only_geom_only (see
# slurm/warmup_shared_dataset_family_only_geom_only.sbatch).
#
# Run with: dimred-sweep configs/tuning_sweep_supcon_family_only_geom_only.example.yaml --cache-dir runs/_shared_dataset_cache_family_only_geom_only

base:
  seed: 42
  output_dir: runs/tuning_supcon_family_only_geom_only
  model: supcon
  data_source: pyxtal

  pyxtal:
    families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
    structures_per_family: 500
    distribution: uniform
    n_species: 1 # was 2 in round 1
    seed: 42

  soap:
    r_cut: 5.0
    n_max: 4
    l_max: 3
    sigma: 0.5
    element_agnostic: true # was false in round 1
    normalize_distances: false
    species: null

  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

  vae:
    encoder_hidden_dim: [128] # overridden by the grid below
    latent_dim: 8
    mirror: true

  supcon:
    mode: family_only
    lambda_family: 1.0
    tau: 0.1 # overridden by the grid below
    distance: cosine # fixed -- euclidean dropped, see header comment
    lambda_norm: 0.0
    projection_dim: 128

  batching:
    strategy: random # overridden by the grid below
    balanced_params: {P: null, K: 16, S: null}

  tails:
    classification:
      mode: family_only
      head_hidden_dim: 16
    train:
      epochs: 40
      batch_size: 32
      optimizer: adam
      device: gpu
      early_stopping:
        enabled: true
        patience: 10
        min_delta: 0.0001
        restore_best_weights: true

  train:
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
      restore_best_weights: true

# 2 encoder shapes x 2 tau values x 2 batching strategies = 8 runs
# (distance fixed at cosine, see header comment -- half of round 1's 16).
grid:
  vae.encoder_hidden_dim:
    - [64]
    - [128, 64]
  supcon.tau: [0.05, 0.1]
  batching.strategy: [random, balanced]
