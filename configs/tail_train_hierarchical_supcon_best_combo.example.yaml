# Round 15 "best of everything" combo (see
# configs/single_run_supcon_best_combo.example.yaml): spacegroup pipeline
# (hierarchical_supcon) on the SAME new body -- sg_encoder_hidden_dim:
# [256, 128], sg_latent_dim: 32, sg_projection_dim: 128 (matching the
# family body exactly), sg_classifier_hidden_dim: 32,
# sg_visualization_hidden_dim: [64, 32] (both winning widened values from
# round 15 sweep E).
#
# Run with:
#   dimred-train-tail configs/tail_train_hierarchical_supcon_best_combo.example.yaml <run_dir printed by the single_run_supcon_best_combo job>

tail_kind: hierarchical_supcon
output_subdir: hierarchical_supcon_best_combo

hierarchical_supcon:
  head_hidden_dim: 32
  min_samples_per_expert: 10
  sg_encoder_hidden_dim: [256, 128]
  sg_latent_dim: 32
  sg_tau: 0.05
  sg_distance: cosine
  sg_lambda_norm: 0.0
  sg_projection_dim: 128
  sg_projection_hidden_dim: null
  sg_classifier_hidden_dim: 32
  sg_visualization_hidden_dim: [64, 32]
  sg_visualization_tau: 0.1
  sg_visualization_distance: euclidean
  sg_visualization_lambda_norm: 0.0

seed: 42

train:
  epochs: 200
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
