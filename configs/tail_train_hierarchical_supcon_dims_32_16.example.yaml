# Khosla-topology experiment, spacegroup pipeline: the per-family SupCon
# SG (dim_red.pipeline.config.HierarchicalSupconTailConfig) mirroring
# configs/single_run_supcon_dims_32_16.example.yaml's change to the
# family pipeline -- sg_latent_dim: 32 (was 8), sg_projection_dim: 16
# (was 128), sg_projection_hidden_dim stays null (-> [32]). Everything
# else identical to the established round 13/14 recipe
# (configs/tail_train_hierarchical_supcon_round7.example.yaml):
# sg_encoder_hidden_dim [128,64], sg_tau/sg_distance 0.05/cosine,
# sg_classifier_hidden_dim 16, sg_visualization_hidden_dim [32,16],
# sg_visualization_tau/distance 0.1/euclidean, same body-scale training
# recipe for all three stages (SG body, classifier, visualizer).
#
# Deliberately targets the SAME new body as the family-level tail above
# (not round 7's original 8-dim body), so stage 1 routing and everything
# downstream is internally consistent with the new dimensions -- this is
# the "both pipelines, same experiment, in parallel" comparison, not two
# independent ablations.
#
# Run with:
#   dimred-train-tail configs/tail_train_hierarchical_supcon_dims_32_16.example.yaml <run_dir printed by the single_run_supcon_dims_32_16 job>

tail_kind: hierarchical_supcon
output_subdir: hierarchical_supcon_dims_32_16

hierarchical_supcon:
  head_hidden_dim: 16
  min_samples_per_expert: 10
  sg_encoder_hidden_dim: [128, 64]
  sg_latent_dim: 32
  sg_tau: 0.05
  sg_distance: cosine
  sg_lambda_norm: 0.0
  sg_projection_dim: 16
  sg_projection_hidden_dim: null
  sg_classifier_hidden_dim: 16
  sg_visualization_hidden_dim: [32, 16]
  sg_visualization_tau: 0.1
  sg_visualization_distance: euclidean
  sg_visualization_lambda_norm: 0.0

seed: 42

train:
  epochs: 200
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
