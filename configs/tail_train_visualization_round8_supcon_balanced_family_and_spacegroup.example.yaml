# Round 8 visualization-tail experiment, target 2/2 (see the family_only
# sibling config for the target body's identity/rationale): same body,
# mode: family_and_spacegroup instead -- reproducing the exact "richtail"
# recipe (distance: euclidean, lambda_norm: 0.0, hidden_dim: [32,16],
# batch=128, epochs=200) from
# configs/tail_train_visualization_supcon_family_and_spacegroup_rich.example.yaml.
# This particular body's own training DID use balanced batching (so its
# embeddings.npz already carries a resolved spacegroup_classes vocabulary
# for its own batching), but that isn't actually why family_and_spacegroup
# works here -- pipeline.tail_training.train_tail builds its own
# family/spacegroup ids fresh from the raw `labels`/`spacegroups` arrays
# regardless (see the topmodel sibling config's comment for the full
# explanation).
#
# Run with:
#   dimred-train-tail configs/tail_train_visualization_round8_supcon_balanced_family_and_spacegroup.example.yaml runs/tuning_supcon_family_only_round8/20260915-1/model-supcon_hd-128-64_pyxtal-cub-hex-mon-ort-tet-tri-tri_nsp1_supcon-family_only_tau0.1_lf1-4

tail_kind: visualization

visualization:
  viz_dim: 2
  mode: family_and_spacegroup
  lambda_family: 1.0
  lambda_spacegroup: 1.0
  tau: 0.1
  distance: euclidean
  lambda_norm: 0.0
  hidden_dim: [32, 16]
  batching:
    strategy: random

output_subdir: visualization_round8_supcon_balanced_family_and_spacegroup

seed: 42

train:
  epochs: 200
  batch_size: 128
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
