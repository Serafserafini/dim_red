# Khosla-topology experiment, family-level visualization tail: targets
# the body trained by configs/single_run_supcon_dims_32_16.example.yaml
# (latent_dim=32, projection_dim=16). Same recipe as the euclidean
# family-only sibling for round 7
# (tail_train_visualization_round8_topmodel_family_only_euclidean.example.yaml)
# -- hidden_dim, tau, distance, training recipe -- so the only variable
# that changed relative to that baseline is the body itself (and
# therefore this tail's input width: 32-dim instead of 8-dim).
#
# Run with:
#   dimred-train-tail configs/tail_train_visualization_dims_32_16.example.yaml <run_dir printed by the single_run_supcon_dims_32_16 job>

tail_kind: visualization

visualization:
  viz_dim: 2
  mode: family_only
  lambda_family: 1.0
  tau: 0.1
  distance: euclidean
  lambda_norm: 0.0
  hidden_dim: [32, 16]
  batching:
    strategy: random

output_subdir: visualization_family_only_euclidean

seed: 42

train:
  epochs: 200
  batch_size: 128
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
