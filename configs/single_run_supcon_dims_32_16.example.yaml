# Khosla-topology experiment: identical to round 7's reference body
# (see the project_family_only_round7_reference memory) except
# vae.latent_dim: 32 (was 8) and supcon.projection_dim: 16 (was 128).
# Flips the encoder/projection width ratio to match Khosla et al. 2020's
# own topology (projection narrower than the encoder's own output, e.g.
# their 2048 -> 128) instead of round 7's inverted one (8 -> 128, wider).
# See the "dimensioni" discussion in this project's notes for the full
# rationale -- round 7's encoder output IS the compact representation
# used downstream (playing the role Khosla's own *projection* plays),
# so its own projection tail doesn't have an obvious analogue in the
# original paper; this experiment tests whether giving the encoder more
# room (32) and the projection its "correct" narrower role (16) changes
# anything, for both the family pipeline (this run) and the spacegroup
# pipeline (dims_32_16 hierarchical_supcon sibling, same body).
#
# projection_hidden_dim stays null -> resolves to [latent_dim] = [32],
# same convention as round 7's own [8].
#
# tails.classification (auto-trained, light recipe) is identical to
# round 7's own -- the point of comparison is the body change alone.
#
# Run with:
#   dimred-run configs/single_run_supcon_dims_32_16.example.yaml --cache-dir runs/_shared_dataset_cache_family_only_geom_rich

seed: 42
output_dir: runs/experiment_pipeline_dims_32_16
model: supcon
data_source: pyxtal

soap:
  r_cut: 6.0
  n_max: 8
  l_max: 6
  sigma: 0.5
  element_agnostic: true
  normalize_distances: false
  species: null

vae:
  encoder_hidden_dim: [128, 64]
  latent_dim: 32
  mirror: true

train:
  epochs: 200
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  val_ratio: 0.2
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true

supcon:
  mode: family_only
  lambda_family: 1.0
  tau: 0.05
  distance: cosine
  lambda_norm: 0.0
  projection_dim: 16
  projection_hidden_dim: null

batching:
  strategy: random
  balanced_params:
    K: 16

pyxtal:
  families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
  structures_per_family: 500
  distribution: uniform
  n_species: 1
  seed: 42

augmentation:
  n_augmented: 4
  keep_original: true
  jitter_probability: 0.5
  jitter_std: 0.05
  vacancy_probability: 0.5
  vacancy_atom_probability: 1
  max_vacancies: 1
  supercell_radius: 4.0
  seed: 42

tails:
  train:
    epochs: 40
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    device: gpu
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
      restore_best_weights: true
  classification:
    mode: family_only
    lambda_family: 1.0
    head_hidden_dim: 16
