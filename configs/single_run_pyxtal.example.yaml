# Example config for a single pyxtal -> SOAP -> VAE run: builds the dataset
# with dim_red.generate (synthetic, symmetry-valid structures) instead of
# fetching from Materials Project. Requires `pip install pyxtal` -- not a
# hard dim_red dependency.
# Run with: python -m dim_red.pipeline.cli --config configs/single_run_pyxtal.example.yaml
# or:       dimred-run configs/single_run_pyxtal.example.yaml

seed: 42
output_dir: runs
data_source: pyxtal # "fetch" (default, Materials Project) or "pyxtal"

# "fetch" (crystal_systems/limit_per_system/api_key) is unused with
# data_source: pyxtal -- omitted here.

pyxtal:
  # Restrict generation to these crystal families; omit for all 7. Mutually
  # exclusive with an explicit "spacegroups: [225, 196, ...]" list.
  families: [cubic, hexagonal]
  # Exactly one of structures_per_family / structures_per_spacegroup:
  structures_per_family: 30
  # How structures_per_family is split across a family's space groups:
  # "uniform" (as evenly as possible) or "random".
  distribution: uniform
  # Number of distinct chemical species per structure (elements themselves
  # don't matter -- sampled from a built-in placeholder pool).
  n_species: 2
  # Optional: pins the generated dataset independently of the top-level
  # "seed" above. Without this, pyxtal generation reuses "seed", so sweeping
  # it (e.g. "grid: {seed: [0, 1, 2]}" for repeated-seed training runs) or
  # any other hyperparameter would silently regenerate a different dataset
  # each time. Set this to test different hyperparameters on the exact same
  # generated dataset.
  seed: 42

soap:
  r_cut: 5.0
  n_max: 4
  l_max: 3
  sigma: 0.5
  element_agnostic: false
  normalize_distances: false
  species: null # auto-detected from the generated structures

vae:
  encoder_hidden_dim: [128, 64]
  decoder_hidden_dim: null # null -> mirrors the encoder
  latent_dim: 2
  mirror: true

aux_heads:
  mode: none
  lambda_family: 1.0
  lambda_spacegroup: 1.0
  head_hidden_dim: 16

train:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001 # Adam's learning rate (used when optimizer: adam,
    # the default); unused when optimizer: velo
  optimizer: adam # "adam" (default, fast) or "velo" (learned_optimization's
    # pretrained VeLO meta-learned optimizer -- much slower to start, see CLAUDE.md)
  beta: 1.0
  val_ratio: 0.2
  device: cpu
