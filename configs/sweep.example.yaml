# Example sweep config: grid over VAE hidden-layer configs (axis A) x
# crystal-system subsets (axis B). Runs sharing a crystal-system subset reuse
# the same cached dataset (fetch + SOAP run once per subset, not per run).
# Run with: python -m dim_red.pipeline.cli --config configs/sweep.example.yaml --sweep

seed: 42
output_dir: runs
api_key: null

data:
  crystal_system_sets:
    - [cubic]
    - [cubic, hexagonal]
    - [cubic, hexagonal, tetragonal]
  limit_per_system: 15

soap:
  r_cut: 5.0
  n_max: 4
  l_max: 3
  sigma: 0.5
  element_agnostic: false
  normalize_distances: false
  species: null

vae:
  hidden_layer_configs:
    - [128]
    - [128, 64]
    - [128, 64, 32]
  latent_dim: 2
  mirror: true

train:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  beta: 1.0
  val_ratio: 0.2
  device: cpu
