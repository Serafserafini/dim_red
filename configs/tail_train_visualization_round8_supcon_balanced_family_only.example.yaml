# Round 8 visualization-tail experiment, target 2/2: the best round-8
# supcon run trained with batching.strategy=balanced (the config family
# specifically requested for this comparison) -- tau=0.1/cosine/hd-128-64,
# family accuracy 0.9696 among the 8 balanced-batching round-8 supcon
# configs (vs 0.9199/0.9271/0.9588 for the other three).
#
# mode: family_only -- see the topmodel_family_only sibling config for the
# distance: cosine rationale (same reasoning applies here).
#
# Run with:
#   dimred-train-tail configs/tail_train_visualization_round8_supcon_balanced_family_only.example.yaml runs/tuning_supcon_family_only_round8/20260915-1/model-supcon_hd-128-64_pyxtal-cub-hex-mon-ort-tet-tri-tri_nsp1_supcon-family_only_tau0.1_lf1-4

tail_kind: visualization

visualization:
  viz_dim: 2
  mode: family_only
  lambda_family: 1.0
  tau: 0.1
  distance: cosine
  lambda_norm: 0.0
  hidden_dim: [32, 16]
  batching:
    strategy: random

output_subdir: visualization_round8_supcon_balanced_family_only

seed: 42

train:
  epochs: 200
  batch_size: 128
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
