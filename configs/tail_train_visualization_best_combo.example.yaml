# Round 15 "best of everything" combo (see
# configs/single_run_supcon_best_combo.example.yaml): family-level
# visualization tail on that body, hidden_dim: [64, 32] (the winning
# widened value from round 15 sweep E). Same tau/distance/training recipe
# as the other round 15 euclidean family viz configs.
#
# Run with:
#   dimred-train-tail configs/tail_train_visualization_best_combo.example.yaml <run_dir printed by the single_run_supcon_best_combo job>

tail_kind: visualization

visualization:
  viz_dim: 2
  mode: family_only
  lambda_family: 1.0
  tau: 0.1
  distance: euclidean
  lambda_norm: 0.0
  hidden_dim: [64, 32]
  batching:
    strategy: random

output_subdir: visualization_family_only_euclidean

seed: 42

train:
  epochs: 200
  batch_size: 128
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
