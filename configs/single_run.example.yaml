# Example config for a single fetch -> SOAP -> VAE run.
# Run with: python -m dim_red.pipeline.cli --config configs/single_run.example.yaml

seed: 42
output_dir: runs
data_source: fetch # "fetch" (default, Materials Project) or "pyxtal"

fetch:
  crystal_systems: [cubic, hexagonal]
  limit_per_system: 15
  api_key: null # falls back to the MP_API_KEY environment variable

soap:
  r_cut: 5.0
  n_max: 4
  l_max: 3
  sigma: 0.5
  element_agnostic: false
  normalize_distances: false
  species: null # auto-detected from the fetched structures

# Optional structure-level data augmentation, applied right after
# fetch/pyxtal and before SOAP -- positional jitter (simulated thermal
# noise: small Gaussian displacements of every atom) and/or vacancy removal
# (randomly deleting atoms). Omit this block entirely (default) to disable
# augmentation, current behavior unchanged. Every augmented copy is
# guaranteed to have at least one of the two actually applied to it (a copy
# where neither probability roll succeeds still gets one forced on) -- so if
# only one mechanism is configured at all (e.g. vacancy_probability: 0.0,
# jitter left on), that one applies to every augmented copy regardless of
# its own probability. Example, commented out:
# augmentation:
#   n_augmented: 1 # augmented copies generated per structure
#   keep_original: true # also keep the unmodified structure alongside them
#   jitter_probability: 0.5 # chance, per augmented copy, that jitter applies at all
#   jitter_std: 0.05 # Angstroms
#   vacancy_probability: 0.0 # chance, per augmented copy, that vacancy removal applies at all
#   vacancy_atom_probability: 0.05 # chance any individual atom is removed, once selected
#   max_vacancies: null # null -> uncapped, short of the structure's own floor of 1 atom
#   supercell_radius: null # Angstroms; null -> skip supercell expansion. Set
#     # this (e.g. equal to soap.r_cut above) to first expand every structure
#     # into a supercell that fits a sphere of this radius before augmenting
#     # -- useful for very small unit cells (pyxtal can generate cells with
#     # as few as 1-2 atoms) that otherwise have almost nothing to jitter/
#     # remove.
#   seed: null # null -> falls back to the top-level `seed`

vae:
  encoder_hidden_dim: [128, 64]
  decoder_hidden_dim: null # null -> mirrors the encoder
  latent_dim: 2
  mirror: true

# Optional auxiliary classification heads on the latent z. mode: none (this
# default) reproduces the plain VAE unchanged. Other options: family_only,
# family_and_spacegroup (see configs/sweep_aux_heads.example.yaml).
aux_heads:
  mode: none
  lambda_family: 1.0
  lambda_spacegroup: 1.0
  head_hidden_dim: 16

train:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001 # unused by the VeLO optimizer, kept for API compatibility
  beta: 1.0
  val_ratio: 0.2
  device: cpu
  # Optional early stopping (same mechanism for vae/autoencoder/supcon):
  # stop once val_loss hasn't improved by more than min_delta for `patience`
  # consecutive epochs. Disabled by default (enabled: false, shown here).
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.0
    restore_best_weights: true # keep the best-val_loss epoch's params, not necessarily the last
