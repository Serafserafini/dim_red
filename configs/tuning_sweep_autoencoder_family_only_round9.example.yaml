# Round 9 ("scale_invariance") of configs/tuning_sweep_autoencoder_family_only_round7.example.yaml
# -- see configs/tuning_sweep_vae_family_only_round9.example.yaml's header
# comment for the full rationale: same soap/train as round 7 except
# soap.normalize_distances: false -> true. A NEW dataset cache.
#
# Run with: dimred-sweep configs/tuning_sweep_autoencoder_family_only_round9.example.yaml --cache-dir runs/_shared_dataset_cache_family_only_round9

base:
  seed: 42
  output_dir: runs/tuning_autoencoder_family_only_round9
  model: autoencoder
  data_source: pyxtal

  pyxtal:
    families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
    structures_per_family: 500
    distribution: uniform
    n_species: 1
    seed: 42

  soap:
    r_cut: 6.0
    n_max: 8
    l_max: 6
    sigma: 0.5
    element_agnostic: true
    normalize_distances: true # was false in every prior round
    species: null

  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

  vae:
    encoder_hidden_dim: [128] # overridden by the grid below
    latent_dim: 8 # overridden by the grid below
    mirror: true

  aux_heads:
    mode: family_only
    lambda_family: 1.0 # overridden by the grid below
    head_hidden_dim: 16

  train:
    epochs: 200
    batch_size: 128
    learning_rate: 0.001
    optimizer: adam
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 20
      min_delta: 0.0001
      restore_best_weights: true

# 3 encoder shapes x 2 latent_dim values x 2 lambda_family values = 12
# runs -- same grid as round 7, only normalize_distances changed.
grid:
  vae.encoder_hidden_dim:
    - [64]
    - [128, 64]
    - [128, 64, 32]
  vae.latent_dim: [4, 8]
  aux_heads.lambda_family: [0.5, 2.0]
