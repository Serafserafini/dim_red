# Presentation figure: 2D visualization tail for the single-stage control run
# (configs/presentation_single_stage_family_and_spacegroup.yaml). Same recipe
# as configs/tail_train_visualization_best_combo.example.yaml (hidden_dim
# [64, 32], tau 0.1, euclidean, 200 epochs / batch 128) except
# mode: family_and_spacegroup.
#
# Run with:
#   dimred-train-tail configs/presentation_single_stage_viz_tail.yaml <run_dir>

tail_kind: visualization

visualization:
  viz_dim: 2
  mode: family_and_spacegroup
  lambda_family: 1.0
  lambda_spacegroup: 1.0
  tau: 0.1
  distance: euclidean
  lambda_norm: 0.0
  hidden_dim: [64, 32]
  batching:
    strategy: random

output_subdir: visualization_family_and_spacegroup_euclidean

seed: 42

train:
  epochs: 200
  batch_size: 128
  optimizer: adam
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
