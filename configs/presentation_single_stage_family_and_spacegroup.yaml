# Presentation figure: SINGLE-STAGE control for the round-15 best_combo model.
#
# Identical to configs/single_run_supcon_best_combo.example.yaml (same SOAP,
# same encoder [256, 128] / latent_dim 32 / projection_dim 128 body, same
# tau/distance/training recipe, same 500/family pyxtal data + augmentation,
# same seed) EXCEPT the body's SupCon loss contrasts on family AND space group
# at once (supcon.mode: family_and_spacegroup, lambda 1/1), and the
# classification tail is family_and_spacegroup too. No hierarchical /
# per-family space-group experts at all. The 2D visualization tail
# (family_and_spacegroup) is trained afterwards with
# configs/presentation_single_stage_viz_tail.yaml.
#
# Run with:
#   dimred-run configs/presentation_single_stage_family_and_spacegroup.yaml --cache-dir experiments/runs/_shared_dataset_cache_presentation

seed: 42
output_dir: experiments/runs/presentation_single_stage
model: supcon
data_source: pyxtal

soap:
  r_cut: 6.0
  n_max: 8
  l_max: 6
  sigma: 0.5
  element_agnostic: true
  normalize_distances: false
  species: null

vae:
  encoder_hidden_dim: [256, 128]
  latent_dim: 32
  mirror: true

train:
  epochs: 200
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  val_ratio: 0.2
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true

supcon:
  mode: family_and_spacegroup
  lambda_family: 1.0
  lambda_spacegroup: 1.0
  tau: 0.05
  distance: cosine
  lambda_norm: 0.0
  projection_dim: 128
  projection_hidden_dim: null

batching:
  strategy: random
  balanced_params:
    K: 16

pyxtal:
  families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
  structures_per_family: 500
  distribution: uniform
  n_species: 1
  seed: 42

augmentation:
  n_augmented: 4
  keep_original: true
  jitter_probability: 0.5
  jitter_std: 0.05
  vacancy_probability: 0.5
  vacancy_atom_probability: 1
  max_vacancies: 1
  supercell_radius: 4.0
  seed: 42

tails:
  train:
    epochs: 40
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    device: gpu
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
      restore_best_weights: true
  classification:
    mode: family_and_spacegroup
    lambda_family: 1.0
    lambda_spacegroup: 1.0
    head_hidden_dim: 32
