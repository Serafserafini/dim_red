# Round 19 hidden-dim sweep -- variant: viz_deeper
# Per-family SupCon SG experts (hierarchical_supcon), oracle-routing only
# reported for this sweep. Paired with experiments/round19_sweep/viz_deeper.yaml.
#
# Run with:
#   dimred-train-tail configs/round19_sweep/tail_train_viz_deeper.example.yaml <run_dir>

tail_kind: hierarchical_supcon
output_subdir: hierarchical_supcon_round19_viz_deeper

hierarchical_supcon:
  head_hidden_dim: 32
  min_samples_per_expert: 10
  sg_encoder_hidden_dim: [256, 128]
  sg_latent_dim: 32
  sg_tau: 0.05
  sg_distance: cosine
  sg_lambda_norm: 0.0
  sg_projection_dim: 128
  sg_projection_hidden_dim: null
  sg_classifier_hidden_dim: 32
  sg_visualization_hidden_dim: [64, 32, 16]
  sg_visualization_hidden_dim_by_family:
    Hexagonal: [64, 32, 16, 8]
    Monoclinic: [64, 32, 16, 8]
    Orthorhombic: [64, 32, 16, 8]
    Triclinic: [64, 32, 16, 8]
    Trigonal: [64, 32, 16, 8]
    Tetragonal: [128, 64, 32]
  sg_visualization_tau: 0.1
  sg_visualization_distance: euclidean
  sg_visualization_lambda_norm: 0.0

seed: 42

train:
  epochs: 200
  batch_size: 128
  learning_rate: 0.001
  device: gpu
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001
    restore_best_weights: true
