# Quick try-it-out config for the hierarchical (family -> per-family
# spacegroup expert) workflow: a small pyxtal -> SOAP -> SupCon body run with
# a family classification tail and a visualization tail auto-trained right
# after the body (``tails:`` below), so `dimred-run` produces the body and
# both tails in one shot. Uses data_source: pyxtal (no MP_API_KEY needed)
# since pyxtal's family is a deterministic function of spacegroup, making the
# hierarchy easiest to sanity-check.
# Run with: dimred-run configs/single_run_supcon_hierarchical.example.yaml
#
# The per-family spacegroup experts are then added to the finished run with
# a hierarchical_supcon tail (one SupCon encoder + classifier + visualizer per
# family, trained on that family's own rows):
#   dimred-train-tail configs/tail_train_hierarchical_supcon_best_combo.example.yaml <run_dir>

seed: 42
output_dir: runs_hierarchical
model: supcon
data_source: pyxtal

pyxtal:
  families: [cubic, hexagonal, orthorhombic]
  structures_per_family: 30
  distribution: uniform
  n_species: 2
  seed: 42

soap:
  r_cut: 5.0
  n_max: 4
  l_max: 3
  sigma: 0.5
  species: null

encoder:
  encoder_hidden_dim: [64, 32]
  latent_dim: 8

supcon:
  mode: family_only
  tau: 0.1
  projection_dim: 32

train:
  epochs: 10
  batch_size: 32
  val_ratio: 0.2
  device: cpu

# Auto-train a family classification tail and a 2D visualization tail right
# after the body finishes.
tails:
  classification:
    head_hidden_dim: 16
  visualization:
    viz_dim: 2
    mode: family_only
  train:
    epochs: 20
    batch_size: 32
