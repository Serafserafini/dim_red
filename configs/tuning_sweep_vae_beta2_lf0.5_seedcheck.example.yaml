# Follow-up experiment (point 4 in experiments/family_only_sweep_notes.md, not
# tracked by git): checks whether the vae.encoder_hidden_dim: [128, 64],
# train.beta: 2.0, aux_heads.lambda_family: 0.5 cell's near-random accuracy
# (0.1457, family_ce stuck at ~ln(7) the entire run) is a systematic effect of
# that weight combination or just seed/initialization sensitivity --
# configs/tuning_sweep_vae_family_only.example.yaml's own seed=42 run for
# this exact cell never recovers (JAX is deterministic given the same seed,
# so rerunning with seed=42 again would just reproduce the identical
# collapse -- this sweeps NEW seeds instead).
#
# Everything that defines the dead cell is fixed (not swept): encoder shape,
# beta, lambda_family. pyxtal.seed stays pinned at 42 (identical dataset
# across all 3 runs) -- only the top-level `seed` (weight init + training)
# varies, over values never tried before.
#
# Shares the exact same pyxtal:/soap:/augmentation: fragment as
# configs/tuning_sweep_{vae,autoencoder,supcon}_family_only.example.yaml, so
# it hashes to the identical dataset cache key -- run with
# --cache-dir runs/_shared_dataset_cache_family_only (already warm, no new
# warmup job needed).
#
# Selection criterion: if all 3 new seeds collapse again to
# family_ce~=ln(7)/accuracy~=0.14, it's a systematic effect of this weight
# combination (beta too high relative to lambda_family "drowns" the
# classification signal) -- worth flagging/avoiding in future rounds. If at
# least one recovers a high accuracy, it's initialization sensitivity, not a
# structural problem with the combination. No automatic winner selection.
#
# Run with: dimred-sweep configs/tuning_sweep_vae_beta2_lf0.5_seedcheck.example.yaml --cache-dir runs/_shared_dataset_cache_family_only

base:
  seed: 42 # overridden by the grid below
  output_dir: runs/tuning_vae_beta2_lf0.5_seedcheck
  model: vae
  data_source: pyxtal

  pyxtal:
    families: [triclinic, monoclinic, orthorhombic, tetragonal, trigonal, hexagonal, cubic]
    structures_per_family: 500
    distribution: uniform
    n_species: 2
    seed: 42 # pinned -- NOT swept, so the dataset stays identical across
    # every seed value the grid below tries for the top-level `seed`.

  soap:
    r_cut: 5.0
    n_max: 4
    l_max: 3
    sigma: 0.5
    element_agnostic: false
    normalize_distances: false
    species: null

  augmentation:
    n_augmented: 4
    keep_original: true
    jitter_probability: 0.5
    jitter_std: 0.05
    vacancy_probability: 0.5
    vacancy_atom_probability: 1
    max_vacancies: 1
    supercell_radius: 4.0
    seed: 42

  vae:
    encoder_hidden_dim: [128, 64] # fixed -- exactly the dead cell's shape
    latent_dim: 8
    mirror: true

  aux_heads:
    mode: family_only
    lambda_family: 0.5 # fixed -- exactly the dead cell's value
    head_hidden_dim: 16

  train:
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    optimizer: adam
    beta: 2.0 # fixed -- exactly the dead cell's value
    val_ratio: 0.2
    device: gpu
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
      restore_best_weights: true

# 3 new seeds, never tried before for this cell (the original sweep only ever
# used seed=42, which is deterministic and would just reproduce the same
# collapse) -- 3 runs, all sharing one cached dataset build (pyxtal.seed
# above stays pinned regardless of this axis).
grid:
  seed: [1, 2, 3]
