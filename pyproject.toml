[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dim_red"
description = "Dimensionality reduction toolkit for crystal structures (SOAP, PCA, UMAP, VAE)."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scikit-learn",
]

[project.scripts]
dimred-run = "dim_red.pipeline.cli:run_command"
dimred-sweep = "dim_red.pipeline.cli:sweep_command"
dimred-rerun = "dim_red.pipeline.cli:rerun_command"
dimred-compare = "dim_red.pipeline.cli:compare_command"
dimred-apply = "dim_red.pipeline.cli:apply_command"

[project.optional-dependencies]
soap = ["ase", "dscribe"]
fetch = ["mp-api", "pymatgen", "ase"]
umap = ["umap-learn"]
vae = ["jax", "jaxlib", "flax", "optax"]
analysis = ["matplotlib"]
pipeline = ["pyyaml"]
dev = [
    "dim_red[soap,fetch,umap,vae,analysis,pipeline]",
    "pytest",
    "pre-commit",
]

[tool.setuptools.dynamic]
version = { attr = "dim_red.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
