name: Docs

# Builds the Sphinx site under docs/ and publishes it to GitHub Pages.
# The build only needs docs/requirements.txt -- the dim_red scientific-stack
# runtime deps (jax, dscribe, pymatgen, ...) are mocked out in docs/conf.py's
# autodoc_mock_imports, since none of that is needed just to read a
# docstring/signature. See docs/conf.py for the rationale.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build Sphinx site
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
